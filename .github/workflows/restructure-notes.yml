name: Sync complete reading blocks

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '上游分支、标签或提交 SHA（默认 main）'
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: reading-blocks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, split and validate the book
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python tools/restructure_all_chapters.py --sync --ref "$SOURCE_REF"
      - name: Commit complete reading content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md learning/README.md notes source
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync complete reading blocks and original images"
          git push
